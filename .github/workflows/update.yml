name: Daily update

# XWLB (CCTV Xinwen Lianbo) daily update.
#
# The data-generating code now lives in THIS repo (scripts/xwlb_build.py).
# The previous version ran the private pipeline repo
# (nelsonwang222/china-leadership-tracker-pipeline) via the PIPELINE_DEPLOY_KEY
# secret; that repo is unreachable (checkout fails with 404 on every run), so
# the dataset froze at 2026-08-02. The scanner below rebuilds the same feed
# straight from tv.cctv.com and merges new days into docs/data/ without
# touching the published 2016-2026 archive rows.
#
# Paths owned here: xwlb/ + docs/data/{index.json,meta.json,events-YYYY.json}
# Paths owned by rmrb.yml: rmrb/ + docs/data/rmrb/   (disjoint — no conflicts)

on:
  schedule:
    - cron: "30 14 * * *"   # 22:30 Beijing — after the 19:00 broadcast transcript is posted
    - cron: "30 23 * * *"   # next-morning catch-up for late transcripts
  workflow_dispatch:
    inputs:
      translate_limit:
        description: "Max broadcasts segments to translate this run (0 = skip)"
        default: "300"
      max_days:
        description: "Max days to fetch this run (0 = none)"
        default: "30"
      since:
        description: "Backfill start date (blank = day after published last_date)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Always build on the newest main: a dispatch can happen while the
          # previous run is still committing, and github.sha would then point
          # at a stale tree (published meta.json, records.jsonl).
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch new broadcasts and translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          ARGS="--max-days ${{ github.event.inputs.max_days || '30' }}"
          ARGS="$ARGS --translate-limit ${{ github.event.inputs.translate_limit || '300' }}"
          if [ -n "${{ github.event.inputs.since }}" ]; then
            ARGS="$ARGS --since ${{ github.event.inputs.since }}"
          fi
          python scripts/xwlb_build.py $ARGS

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xwlb
          git add docs/data/index.json docs/data/meta.json
          git add "docs/data/events-*.json"
          git diff --cached --quiet && echo "No data changes." && exit 0
          git commit -m "XWLB data update $(date -u +%F)"
          # The remote may have moved while this run was translating;
          # rebase (preferring this run's freshly built files) and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          git push

  # GITHUB_TOKEN pushes don't trigger pages.yml's push event, so deploy
  # explicitly after publishing (also redeploys when there were no changes;
  # that's a harmless no-op upload).
  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
